name: Build Laura APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Ikon Laura, izin, dan layanan suara
        run: |
          cp -r resources/android/res/. android/app/src/main/res/
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS USE_EXACT_ALARM SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$P" $M || sed -i "s#</manifest>#<uses-permission android:name=\"android.permission.$P\"/></manifest>#" $M
          done
          grep -q RecognitionService $M || sed -i 's#</manifest>#<queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries></manifest>#' $M
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Laura-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
