<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laura · Virtual Assistant</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f5c4d"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1c2a24;--mut:#5d6b64;--ac:#0f5c4d;--acx:#fff;--gold:#a87a08;--ln:#ddd6c6;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181a;--card:#18252a;--ink:#eef3ef;--mut:#9fb0a8;--ac:#4cc3a6;--acx:#08201a;--gold:#e0b84a;--ln:#2b3d43;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181a;--card:#18252a;--ink:#eef3ef;--mut:#9fb0a8;--ac:#4cc3a6;--acx:#08201a;--gold:#e0b84a;--ln:#2b3d43;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font:700 28px/1.2 Georgia,"Times New Roman",serif;margin:4px 0 2px}
h2{font:700 20px Georgia,serif;margin:22px 0 8px}
.sub{color:var(--mut);font-weight:600;font-size:15px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:0 0 auto;border:2px solid var(--ln);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font:700 15px inherit;font-family:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:flex-start}
.row input[type=checkbox]{width:24px;height:24px;margin-top:3px;accent-color:var(--ac);flex:0 0 auto}
.t{font-weight:700}.t.dn{text-decoration:line-through;color:var(--mut)}
.m{color:var(--mut);font-size:14px;font-weight:600}
.bad{color:var(--bad)}.gold{color:var(--gold)}
.tag{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--ln);border-radius:6px;padding:1px 7px;margin-right:6px;color:var(--mut)}
input,textarea,select{width:100%;padding:11px;border:2px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:600 16px inherit;font-family:inherit;margin:4px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:12px 18px;font:700 16px inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.b.s{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.al{background:var(--gold);color:#111;border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;gap:10px;font-weight:700}
input[type=range]{padding:0;border:0;accent-color:var(--ac)}
.bb{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:88%;white-space:pre-wrap}.bb.u{background:var(--ac);color:var(--acx);margin-left:auto}.bb.f{background:var(--card);border:1px solid var(--ln)}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 2px}
.lw{width:58px;height:58px;border-radius:50%;overflow:hidden;border:3px solid var(--ac);box-shadow:0 3px 12px rgba(0,0,0,.22);flex:0 0 auto;display:block}
.lw img{display:block;width:150%;max-width:none;margin:-22% 0 0 -26%}
#al{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:60}.tt{display:flex;flex-direction:column;line-height:1.1}
.tt small{font:700 12px system-ui,sans-serif;color:var(--gold);letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
.w{padding-bottom:120px}
.av{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:84px;height:84px;z-index:30;cursor:pointer;transition:all .5s cubic-bezier(.2,.8,.2,1)}
.av.big{right:50%;bottom:auto;top:calc(14px + env(safe-area-inset-top,0px));width:min(52vw,230px);height:min(52vw,230px);transform:translateX(50%);z-index:41;cursor:default}
.av::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--ac);opacity:0}
.av[data-s=listen]::before,.av[data-s=speak]::before{animation:rg 1.2s ease-out infinite}
@keyframes rg{0%{opacity:.8;transform:scale(.95)}100%{opacity:0;transform:scale(1.18)}}
.ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:3px solid var(--ac);background:#cfd8dc;box-shadow:0 6px 22px rgba(0,0,0,.28);transform-origin:50% 92%;animation:br 4.2s ease-in-out infinite}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.mo{position:absolute;left:45.2%;top:60.2%;width:10%;height:calc(var(--o,0)*5.5%);background:linear-gradient(#f4efe9 0 22%,#4a1a20 22%);border-radius:40% 40% 55% 55%;transform:translateY(-35%);opacity:.9}
@keyframes br{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.025) rotate(.7deg) translateY(-.6%)}}
.av[data-s=listen] .ph{animation:ls 2.6s ease-in-out infinite}
@keyframes ls{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg) translateY(-1%)}}
.av[data-s=think] .ph{animation:th 2s ease-in-out infinite}
@keyframes th{0%,100%{transform:rotate(4deg)}50%{transform:rotate(1.5deg) translateY(1%) scale(1.01)}}
.av[data-s=speak] .ph{animation:sp .6s ease-in-out infinite}
@keyframes sp{0%,100%{transform:translateY(0) rotate(-.9deg)}50%{transform:translateY(-1.6%) rotate(.9deg) scale(1.02)}}
.av[data-s=speak][data-m=happy] .ph{animation-duration:.42s}
.av[data-s=speak][data-m=serious] .ph{animation-duration:.9s}
.av[data-m=happy] .ph{border-color:var(--gold)}.av[data-m=serious] .ph{border-color:var(--bad)}.av[data-m=encourage] .ph{border-color:var(--gold)}
.bd{position:absolute;right:-2px;bottom:-2px;background:var(--card);border:2px solid var(--ln);border-radius:50%;width:32%;height:32%;display:grid;place-items:center;font-size:clamp(14px,4vw,28px);line-height:1}
#ov{position:fixed;inset:0;background:rgba(10,20,18,.62);z-index:40;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + min(52vw,230px) + 36px) 12px 20px}
#ov[hidden]{display:none}
.pn{max-width:640px;margin:0 auto;background:var(--bg);border-radius:18px;padding:14px 14px 18px;position:relative}
.nm{text-align:center;font:700 22px Georgia,serif;margin-bottom:6px}
#chat{max-height:34vh;overflow:auto}
summary{cursor:pointer;margin:8px 0}
@media(max-width:480px){.g{grid-template-columns:1fr}}
</style>
</head>

const MD={happy:'😄',calm:'🙂',serious:'🧐',encourage:'💪',think:'🤔'};
let VO=[],gen=0,sq=0,jaw=0;
const AV=()=>document.getElementById('av');
function sysP(){return S.mode==='tutor'?TUTOR+MODI:PERSONA+MODI+ctx()}
function setS(s){AV().dataset.s=s;const e=document.getElementById('st');if(e)e.textContent=ST[s]}
function setMood(m){if(!MD[m])return;AV().dataset.m=m;document.getElementById('bd').textContent=MD[m]}
function lab(){const g=i=>document.getElementById(i);g('md').textContent=S.mode==='tutor'?'🎓 Mode: Tutor English':'🗂️ Mode: Asisten';g('vb').textContent=S.voice===false?'🔇 Suara mati':'🔊 Suara aktif';g('ml').textContent='🌐 Mic: '+(S.ml==='en-GB'?'EN':'ID')}
function greet(){const t=S.mode==='tutor'?GT:GA;chat.push({r:'f',t});setMood('happy');drawChat();speak(t)}
function setMode(){S.mode=S.mode==='tutor'?'asisten':'tutor';save();chat.length=0;lab();greet()}
function toggleV(){S.voice=S.voice===false;save();if(S.voice===false){try{speechSynthesis.cancel()}catch(e){}setS('idle')}lab()}
function openAv(){document.getElementById('ov').hidden=false;AV().classList.add('big');document.body.style.overflow='hidden';lab();fillV();if(!chat.length)greet();else drawChat()}
function closeAv(){document.getElementById('ov').hidden=true;AV().classList.remove('big');document.body.style.overflow='';try{speechSynthesis.cancel()}catch(e){}gen++;sq=0;setS('idle')}
function fv(l){let c=VO.filter(x=>{const k=x.lang.replace('_','-').toLowerCase();return l==='en'?k==='en-gb':(k.startsWith('id')||k.startsWith('in-'))});if(!c.length&&l==='en')c=VO.filter(x=>x.lang.toLowerCase().startsWith('en'));return c}
function pick(l){const n=l==='en'?S.ven:S.vid,f=VO.find(x=>x.name===n);if(f)return f;const sc=v=>(/natural|neural/i.test(v.name)?4:0)+(/google/i.test(v.name)?2:0)+(/libby|sonia|maisie|hazel|serena|susan|kate|gadis|female|wanita/i.test(v.name)?1:0);return fv(l).sort((a,b)=>sc(b)-sc(a))[0]||null}
function fillV(){[['ve','en',S.ven],['vi','id',S.vid]].forEach(a=>{const e=document.getElementById(a[0]);if(e)e.innerHTML='<option value="">Otomatis (terbaik)</option>'+fv(a[1]).map(x=>'<option value="'+esc(x.name)+'"'+(x.name===a[2]?' selected':'')+'>'+esc(x.name)+'</option>').join('')})}
function isEn(s){const w=s.toLowerCase().match(/[a-z’']+/g)||[];const en=/^(the|a|an|is|are|am|you|i|i’m|we|they|he|she|it|my|your|and|to|of|in|on|for|with|what|where|how|do|does|did|can|could|may|please|hello|hi|good|nice|let|let’s|this|that|have|has|not|will|would|great|well|yes|no|thank|thanks|so|but|if|at|be|was|were)$/,id=/^(yang|dan|di|ke|dari|ini|itu|aku|kamu|saya|nih|ya|dong|yuk|untuk|dengan|tidak|nggak|bisa|mau|sudah|udah|jadwal|hari|besok|kita|pak|ada|jam|sekarang|aja|banget|gimana|apa|kalau|karena|atau|boleh|tahu|berapa|halo|senang|sama|lagi|dulu|jangan|tinggal|bilang|artinya|contoh|coba)$/;let a=0,b=0;w.forEach(x=>{if(en.test(x))a++;if(id.test(x))b++});return a>b}
function speak(t,q){if(S.voice===false||!('speechSynthesis' in window))return;try{if(!q){speechSynthesis.cancel();gen++;sq=0}const g=gen;
(t.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/[*_#`]/g,'').match(/[^.!?\n]+[.!?]*/g)||[]).map(s=>s.trim()).filter(s=>/[a-zA-Z0-9]/.test(s)).forEach(s=>{const en=isEn(s),u=new SpeechSynthesisUtterance(s),v=pick(en?'en':'id');u.lang=en?'en-GB':'id-ID';if(v){u.voice=v;u.lang=v.lang}u.rate=en?.95:1;u.pitch=1;
u.onstart=()=>{if(g===gen)setS('speak')};u.onboundary=()=>{jaw=1};u.onend=u.onerror=()=>{if(g!==gen)return;if(--sq<=0){sq=0;setS('idle')}};sq++;speechSynthesis.speak(u)})}catch(e){}}
try{VO=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{VO=speechSynthesis.getVoices();fillV()}}catch(e){}
setInterval(()=>{const a=AV();a.style.setProperty('--o',a.dataset.s==='speak'?((.25+Math.random()*.75)*(jaw?1:.65)).toFixed(2):0);jaw=0},95);
const PRN=['Subuh','Zuhur','Asar','Magrib','Isya'],PHS=['Pak Abdul, waktu salat {x} sudah masuk. Yuk, ambil wudu dan salat dulu ya!','Waktunya salat {x}, Pak. Tinggalkan sebentar kerjaannya ya. Semoga berkah!'];
const mn=s=>+s.slice(0,2)*60+ +s.slice(3);
function prayer(d){const R=Math.PI/180,lat=-6.2088,lng=106.8456,tz=7,y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate(),Y=m<=2?y-1:y,Mo=m<=2?m+12:m,A=Math.floor(Y/100),B=2-A+Math.floor(A/4),JD=Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(Mo+1))+dd+B-1524.5,D=JD+(12-tz)/24-2451545,fx=(a,b)=>((a%b)+b)%b,g=fx(357.529+0.98560028*D,360),q=fx(280.459+0.98564736*D,360),L=fx(q+1.915*Math.sin(g*R)+0.02*Math.sin(2*g*R),360),e=23.439-3.6e-7*D,RA=fx(Math.atan2(Math.cos(e*R)*Math.sin(L*R),Math.cos(L*R))/R/15,24),de=Math.asin(Math.sin(e*R)*Math.sin(L*R))/R,EqT=fx(q/15-RA+12,24)-12,nn=12+tz-lng/15-EqT,T=a=>Math.acos((-Math.sin(a*R)-Math.sin(de*R)*Math.sin(lat*R))/(Math.cos(de*R)*Math.cos(lat*R)))/R/15,aA=-Math.atan(1/(1+Math.tan(Math.abs(lat-de)*R)))/R,f=t=>{const k=Math.round(fx(t,24)*60+2);return pad(Math.floor(k/60)%24)+':'+pad(k%60)};
return [nn-T(20),nn,nn+T(aA),nn+T(.833),nn+T(18)].map((t,i)=>[PRN[i],f(t)])}
function prTick(){if(S.pr===false)return 0;const t=td(),n=hm();if(S.pd!==t){S.pd=t;S.pf=[]}let c=0;prayer(new Date()).forEach(x=>{if(x[1]<=n&&S.pf.indexOf(x[0])<0){S.pf.push(x[0]);c=1;if(mn(n)-mn(x[1])<=20){alerts.push('🕌 Waktu salat '+x[0]+' ('+x[1]+')');notif2('Waktu salat '+x[0]+' ('+x[1]+')');setMood('encourage');speak(PHS[Math.floor(Math.random()*PHS.length)].replace('{x}',x[0]),1)}}});return c}
function prCard(){const on=S.pr!==false,p=prayer(new Date()),n=hm(),nx=p.find(x=>x[1]>n);
return '<div class="c"><div class="t">🕌 Waktu Salat Hari Ini · Jakarta</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;margin:10px 0">'+p.map(x=>'<div style="padding:8px 2px;border-radius:10px;border:2px solid '+(nx&&nx[0]===x[0]?'var(--ac)':'var(--ln)')+'"><div class="m">'+x[0]+'</div><div class="t">'+x[1]+'</div></div>').join('')+'</div><div class="m">'+(nx?'Berikutnya: '+nx[0]+' '+nx[1]:'Semua waktu hari ini sudah lewat')+'. Hitungan perkiraan (metode Kemenag RI), cek jadwal resmi atau masjid terdekat.</div><button class="b s" style="margin-top:8px" onclick="S.pr=!(S.pr!==false);save();R()">'+(on?'🔔 Pengingat salat: aktif':'🔕 Pengingat salat: mati')+'</button></div>'}
let ATT=null;
function showAtt(){const e=document.getElementById('att');e.innerHTML=ATT?'📎 '+esc(ATT.name)+' <button class="x" style="font-size:20px;margin-left:6px" onclick="ATT=null;showAtt()" aria-label="Hapus lampiran">×</button>':''}
function pickF(el){const f=el.files[0];el.value='';if(!f)return;
if(/\.(pdf|docx?|xlsx?|pptx?)$/i.test(f.name)){alerts.push('Format '+f.name.split('.').pop()+' belum bisa dibaca. Kirim foto atau screenshot halamannya, atau salin teksnya ke chat.');R();return}
const r=new FileReader();
if(f.type.startsWith('image/')){r.onload=()=>{const im=new Image();im.onload=()=>{const sh=(mx,q,cb)=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c)};
sh(320,0,t=>sh(1280,0,c=>c.toBlob(b=>{ATT={name:f.name||'foto.jpg',blob:b,thumb:t.toDataURL('image/jpeg',.7)};showAtt()},'image/jpeg',.82)))};im.src=r.result};r.readAsDataURL(f)}
else{if(f.size>2e6){alerts.push('File terlalu besar (maks 2 MB).');R();return}r.onload=()=>{ATT={name:f.name,text:String(r.result).slice(0,12000)};showAtt()};r.readAsText(f)}}
document.getElementById('lg').src=document.querySelector('.ph img').src;R();tick();setInterval(tick,20000);schedInit();
</script>
